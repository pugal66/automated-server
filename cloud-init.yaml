#cloud-config

package_update: true

packages:
  - docker.io
  - git
  - curl
  - ffmpeg

users:
  - name: testpress
    groups: [docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

write_files:
  - path: /opt/testpress/app.env
    owner: root:root
    permissions: '0640'
    content: |
      APP_NAME=Testpress
      APP_PORT=8080
      APP_ENV=production
